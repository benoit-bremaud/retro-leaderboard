# Local SonarQube analysis. The token is never stored here: `just sonar` reads it from
# ~/.config/sonar-tokens/retro-leaderboard.
sonar.projectKey=retro-leaderboard
sonar.projectName=retro-leaderboard
sonar.host.url=http://localhost:9000
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=120
