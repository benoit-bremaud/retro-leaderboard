# Dependabot — keeps the npm toolchain current; minor and patch bumps are grouped. No
# `github-actions` block: no workflow exists (local CI).
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    # Supply chain: never propose a release younger than a week.
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only: move to 7 when it does.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Node types follow the Node 22 toolchain: a Node major moves .nvmrc, engines and
      # @types/node together.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      toolchain-minor-patch:
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(deps)'
